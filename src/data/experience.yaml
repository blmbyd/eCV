# Career history.
#
# `track: main` roles form the ridge of the elevation profile.
# `track: parallel` roles run alongside it (independent practice).
# `featured: false` roles render as compact single-line entries under "Earlier roles".
# `scope` (1-10) is the vertical axis of the elevation profile: breadth of
# responsibility and seniority, not salary or headcount.

roles:
  - id: predica
    title: Principal DevOps Engineer
    org: Predica, a SoftwareOne company
    orgShort: SoftwareOne
    chartLabel: SoftwareOne
    start: 2022-10
    end: null
    location: Poland · remote
    track: main
    scope: 10
    featured: true
    summary: >-
      Technical pre-sales, solution architecture and migration delivery for enterprise
      customers adopting GitHub, DevOps and AI-assisted development at scale.
    groups:
      - label: Technical pre-sales & customer advisory
        items:
          - Lead technical discovery with enterprise customers to surface the real
            constraints in their software delivery, not just the stated ones.
          - Translate business and engineering requirements into GitHub-based solution
            architectures.
          - Deliver executive briefings, technical workshops, proofs of concept and live
            product demonstrations.
          - text: Partner with account teams to define adoption strategies and technical
              roadmaps.
          - Support customers all the way through evaluation, implementation and
            adoption — not just to signature.
      - label: Migrations to GitHub
        items:
          - Lead enterprise migrations onto GitHub end to end, from assessment and
            migration design through cutover and post-migration adoption.
          - Size and de-risk the work up front through repository and pipeline inventory,
            dependency mapping and phased cutover planning.
          - Rebuild automation on GitHub Actions as part of the move, rather than lifting
            existing pipelines across unchanged.
          - Preserve history, permissions and traceability so teams keep delivering
            through cutover instead of pausing around it.
          - Run pilot waves and enablement so teams land on the new platform productive
            rather than stranded on it.
      - label: GitHub & AI transformation
        items:
          - Advise organisations on GitHub Enterprise and GitHub Copilot adoption
            strategy.
          - Run ROI and value-realisation assessments for AI-assisted software
            development.
          - Design governance, security and operating models for enterprise-scale GitHub
            environments.
          - text: Guide modernisation programmes spanning platform engineering, DevOps
              and AI engineering practices.
      # The technical lead line prints. The speaking and champion lines stay on the
      # page only, since the Speaking & community section covers both in detail.
      - label: Leadership & community
        items:
          - Technical lead for the small project teams formed around individual customer
            engagements.
          - text: Speak at industry conferences, webinars, workshops and community
              events.
          - text: Internal GitHub Champion and Cloud Community Champion, contributing to
              enablement initiatives.

